name: Syntax Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JS syntax
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 | \
            xargs -0 -n1 node --check
